# ============================================================================ #
# 心屿 MindIsle · application.yml · 依据 制作步骤文档 §5.4（键位对齐，勿随意增删）   #
# 铁律：禁止 spring.mandatory-file-encoding（需求 §11.1 第 1 条，中文 Windows 秒退） #
# 编码统一由 .mvn/jvm.config + pom.xml 的 UTF-8 属性保证                           #
# ============================================================================ #
server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200
    max-swallow-size: 10MB

spring:
  application:
    name: mindisle-server
  threads:
    virtual:
      enabled: true            # Boot4 亮点：SSE/WS 并发（论文「并发模型」一节引用）
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s        # 配合上面的 graceful
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  datasource:
    # 三个占位符全部来自 .env（由 EnvLoader 注入为系统属性，见 §5.7）；仓库内永不出现明文口令
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-flash}
          temperature: 0.7
    # ── v1.2.7（阶段 4 · 续 13）框架重试必须收敛在自建 SSE 预算之内 ─────────────────
    # Spring AI 2.0.1 的 spring.ai.retry 默认值是 max-attempts=10、backoff 2s × multiplier=5，
    # 一次断网最坏会退避到分钟级，直接吃穿下面 mindisle.llm.sse-timeout-ms=30000 的 SseEmitter 预算。
    # 实测症状（_cache/009_mindisle/backend-8081-offline.log + degrade_r17.log）：
    #   SpringAiRetryAutoConfiguration "Retry error. Retry count:5..13" → 30s 到点
    #   → AsyncRequestTimeoutException → HTTP 503 / 0 帧 → 前端只报「发送失败」，
    #   离线兜底话术根本没机会上屏；recordFailure 也等不到返回 ⇒ 熔断器永远打不开。
    # 本项目已有「有限重试 + 熔断 + 离线话术库」三层自研降级（T4.13），框架层重试只留一次瞬断补偿。
    # 判据：断网后从发出请求到离线话术上屏 < 10s（Gate4 §7.4 断网演示）。
    retry:
      max-attempts: 2                # 1 次原始调用 + 1 次重试
      backoff:
        initial-interval: 200ms
        multiplier: 2
        max-interval: 1s
      on-client-errors: false        # 401（密钥错）不是瞬断，重试只会把预算烧光
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss.SSS
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  web:
    resources:
      add-mappings: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mindisle.**.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  # Redis 探活关掉：阶段 2 骨架期便携版 Redis 随时可能没起，
  # 让 /actuator/health 反映「进程活着」而不是「外部依赖齐全」；
  # 缓存实现改由 /api/system/info 的 cacheMode 字段暴露（偏差已记 dev-log）
  health:
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

# --------------------- 本项目自定义配置（全部外置，NFR10） --------------------- #
mindisle:
  cache:
    # 用占位符而非裸 local：.env 里的 MINDISLE_CACHE_MODE 经 EnvLoader 变成系统属性后才生效（偏差已记 dev-log）
    mode: ${MINDISLE_CACHE_MODE:local}     # local | redis
  llm:                           # 任务 T4.1/T4.3/T4.13，键位含义见 MindisleProperties.Llm 的 javadoc
    provider: ${MINDISLE_LLM_PROVIDER:spring-ai}   # spring-ai | raw-http | mock
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # 与上面 spring.ai.deepseek.api-key 是同一个环境变量的两次绑定，不是两份真值（理由见 Llm 类注释）
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    temperature: 0.7
    max-tokens: 800
    # ⚠ 事实 B（dev-log 阶段 4）：deepseek-flash 是思考型模型，这一位改成 true
    #   就会让 SSE 一个字都不上屏（content 恒空、reasoning 有内容），界面表现为转圈到超时。
    #   由 SpringAiLlmClientThinkingTest 钉住，改动会先让那条测试变红。
    thinking-enabled: false
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
    sse-timeout-ms: 30000        # 手册 T4.5 的 SseEmitter(30_000)
    price-in-cent-per-1k: 0.1    # 每 1k 输入 token 的分价，上线前按官网核对
    price-out-cent-per-1k: 0.2   # 每 1k 输出 token 的分价
    keep-conversations: 50       # T4.2 单用户活跃会话上限
    title-max-chars: 20          # T4.2 标题取首条用户消息前 N 字
    context-rounds: 8            # T4.3 带最近几轮
    summary-trigger-rounds: 12   # T4.3 超轮数触发摘要压缩
    summary-max-chars: 200       # T4.3 摘要字数上限
    context-max-tokens: 6000     # T4.3 上下文 token 预算，超了截断并记 truncated
    emotion-confident-min: 0.6   # BR12 低于此置信度不进趋势
    emotion-llm-fallback-below: 0.55   # 创新点 1 的级联闸门
    risk-llm-enabled: true       # T4.11 风险模型侧开关
    circuit-fail-threshold: 3    # T4.13 连续失败进熔断的次数
    circuit-half-open-ms: 60000  # T4.13 熔断后半开探测间隔
  env-file: ../.env              # 相对 backend/ 工作目录，见 §5.7
  upload:
    dir: ./uploads               # dev 落在 backend/uploads（已被 .gitignore 排除）
    max-bytes: 5242880           # FR4.1 单张 ≤5MB（与 spring.servlet.multipart.max-file-size 双闸）
    max-edge: 1600               # 重编码长边上限，只缩不放
    jpeg-quality: 0.82           # 仅对 jpg 生效
    max-images-per-post: 9       # FR4.1 单帖 0–9 张，校验点在发帖（T3.3）
    max-total-bytes: 20971520    # FR4.1 单帖配图总量 ≤20MB，同样在发帖时按真实读盘字节判（T3.3）
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: 120
    refresh-days: 7
  rate-limit:
    user-per-minute: 60          # NFR7：普通接口 60 次/分
    ai-per-minute: 6             # NFR7：AI 接口 6 次/分（成本与雪崩保护）
    login-fail-max: 5            # §5.11 T2.16：连错 5 次锁 10 分钟
    login-lock-minutes: 10
  ai-budget:
    user-daily-tokens: 200000
    global-daily-cost-cent: 10000
    alert-ratio: 0.8
  crisis:                        # 任务 3.3 危机分级与工单（需求 §5.2、FR10.5 · 创新点 3）
    hotline: ${CRISIS_HOTLINE:12356}
    l2-score: 0.6                # §5.2「risk ≥0.6 即 L2」；词面规则通道用固定分值，真实分数由任务 4.11 双通道 RiskScorer 产出
    l3-score: 0.9                # §5.2 高分线 0.8，词面通道命中「计划/方式/时间/告别」直接按 0.9 报（宁可误报不可漏报）
    l2-sla-hours: 4              # §5.2 L2 四小时内认领
    l3-sla-minutes: 30           # §5.2 L3 三十分钟内认领
    evidence-chars: 200          # FR10.5 工单证据「脱敏后 200 字上下文」
  audit:                       # 任务 T3.2 敏感词引擎（需求 FR7.1）
    dict-resource: classpath:dict/sensitive_words_v0.1.txt  # jar 内置快照；前缀必须显式写，见 MindisleProperties.Audit 注释
    dict-path: ${MINDISLE_DICT_PATH:}             # 指向日志盘可写快照时才启用真热更新，见 §6.1 行 3.2
    dict-check-millis: 60000                       # 两次比对版本号的节流间隔，避免每次检测读缓存
    dict-version-key: dict:version                 # 管理端 T6.2 改词后写这个键广播
  quota:                         # 任务 T3.12 频率与风控（需求 BR4/BR5/BR6）
    newbie-window-hours: 24
    newbie-daily-posts: 5
    daily-posts: 20
    daily-comments-per-post: 20
  post:                          # 任务 3.3 发帖字段约束（需求 FR4.1、FR4.2 · NFR10 不写死）
    max-title-chars: 50          # FR4.1 标题 ≤50
    max-content-chars: 5000      # FR4.1 正文 ≤5000
    max-topics: 3                # 单帖话题数，超出属引流（FR1.7 防刷屏）
    default-visibility: public   # public | private，FR4.1 两档；friends 属 FR4.6 未开放
    hole-destroy-options: 24,72,168   # 树洞可选存活小时数（手册 §6.1 行 836）
    hole-default-destroy-hours: 168   # FR4.2「默认 7 天后」；发帖时算成绝对时间落 auto_destroy_at
  report:                        # 任务 T3.11 举报（需求 FR4.7、FR4.4 · NFR10 不写死）
    auto-review-threshold: 3      # FR4.4：同一帖被 3 个不同人举报即自动转 HUMAN_REVIEW；人不是次数（uk_reporter_target）
    max-description-chars: 200    # FR4.7 描述字数上限，列宽 500 留的是余量
    max-evidence-images: 3        # FR4.7 截图证据张数
    sla-hours: 24                 # 非危机举报的处理时限；危机类走上面 crisis 的 L2/L3 SLA
  search:                        # 任务 T3.9 站内搜索（需求 FR4.8 · NFR10 不写死）
    max-keyword-chars: 64        # 超长直接 10001，不做「截断兜底」：截断会悄悄改变用户要查的东西
    max-profiles: 20             # 搜话题 / 搜人一次返回的条数上限，也是缺省值被夹住的上界
    fulltext: false              # MATCH 需先执行 sql/10_index.sql（任务 2.2 ◐）；没索引就开 = 每次先抛 1191 再回落
  topic:                         # 任务 T3.8 话题创建与关注（手册 §6.1 行 3.8 · NFR10 不写死）
    max-name-chars: 32           # 与 topic.name 的 VARCHAR(32) 同宽：两处必须同时改，理由见 MindisleProperties.Topic 注释
    max-desc-chars: 200          # 与 topic.desc_txt 的 VARCHAR(200) 同宽
    max-create-per-day: 5        # 手册「防刷」那条的唯一落地：阶段 3 没有审核台（T6.1），配额是第一道闸
    # 话题预审开关 = 需求 FR8.6 的那一项配置。默认 true 照抄 FR4.5「创建需管理员审核」；
    # 设 false 才走机审直通（BLOCK 拒 / REVIEW 转待审 / 干净即过审）。注意：审核台在 T6.1，
    # 今天没有能把 PENDING 话题放行成 APPROVED 的入口，所以默认值下新建话题会停在待审。
    require-pre-review: ${MINDISLE_TOPIC_PRE_REVIEW:true}
  captcha:                       # 任务 T2.16 图形验证码总开关
    # 默认 true 是 fail-closed：不配这个键就必须验码。答案只进缓存、不返回也不打日志，
    # 所以自动化冒烟拿不到它 —— 只有本地开发/CI 才显式设 MINDISLE_CAPTCHA_ENABLED=false，
    # 关掉后启动会打一条 WARN（生产误关能被看见）。
    enabled: ${MINDISLE_CAPTCHA_ENABLED:true}

  schedule:                        # 任务 T4.20 情绪周报定时批次（手册 §7.5 · NFR10 不写死）
    # cron 是 Spring 六段式（秒 分 时 日 月 周）；? * SUN = 每周日。「日」与「周」不能同时指定，
    # 用 ? 占住「日」这一位。这一串由 WeeklyReportJobTest 用 CronExpression.parse 真算过一次
    # 下一个触发时刻来钉住 —— 改坏它（比如把 SUN 写成 SAT）会当场跑红。
    weekly-report-cron: "0 0 21 ? * SUN"   # 周日晚 21:00：手册 §7.5 给的就是这一条口径
    weekly-report-enabled: ${MINDISLE_WEEKLY_REPORT_ENABLED:true}   # 关掉时任务入口打一条 INFO 说明本次跳过，不静默
    weekly-report-batch-limit: 200         # 钱闸：一次周报 = 一次 LLM 调用。只能调小，代码里 MAX_BATCH=200 是上界
    # T4.21 数据保留清除（注销冷静期届满后的物理删除）。凌晨三点：与周报错开，且在线人数最低
    retention-cron: "0 30 3 * * ?"
    retention-enabled: ${MINDISLE_RETENTION_ENABLED:true}
    retention-batch-limit: 50            # 清除一个账号 = 跨 20 多张表的 DELETE 事务，比一次 LLM 调用重得多，故上界比周报小

  privacy:                        # 任务 T4.21 隐私中心（需求 FR1.6 导出与注销 · NFR8 · BR11 · D11）
    # 产物目录：全库最敏感的一批文件（一个人的全部聊天+情绪+帖子+授权流水）。
    # 不放在静态资源目录下 —— 那样任何人拼得出路径；只能经 GET /api/privacy/export/file 带 JWT 与下载口令取。
    export-dir: ${MINDISLE_PRIVACY_EXPORT_DIR:./data/privacy-export}
    link-ttl-hours: 24            # FR1.6 原文口径「下载链接 24h 失效」
    cooling-days: 30              # 手册 §7.5：冷静期内登录即自动撤回注销；配成 0 会被代码夹回 1 天（见 CoolingState#purgeTime）
    max-rows-per-table: 5000      # 单表行数闸：挡住「把 chat_message 全量读进内存序列化」把堆吃穿；被截断会记进导出对账，不静默

  pm:                             # 任务 T5.1–T5.6 站内私信（需求 FR6 · 手册 §8）
    max-content-chars: 1000       # 列宽 2000 取一半：超长在 Java 侧返 400，不依赖 MySQL 截断（见 MindisleProperties.Pm）
    default-size: 20              # 会话列表/消息分页默认条数，与帖子阅读节奏对齐
    max-size: 50                  # 单页上限闸：前端传再大也夹回来，防止整表拉走
    fetch-max: 100                # 断线重连一次补拉的上限（补齐而不是重放），超过它就该整页刷新
    client-msg-id-max-chars: 64   # 与 private_message.client_msg_id 列宽一致，幂等号由前端生成、服务端不自造
    risk-model-enabled: ${MINDISLE_PM_RISK_MODEL:false}   # 私信每条一次 LLM 会把 AI 额度吃光并挤掉陪伴对话；关掉不改变危机建单判据，阶段 7 消融拨这一项
    presence-enabled: ${MINDISLE_PM_PRESENCE:true}        # FR6.5 在线状态总开关；关掉后所有 presence 返回空集合
    retry-batch-limit: 50         # T5.3 定时重投单轮条数上界，防止一次堆积把带宽打满
    retry-grace-seconds: 3        # 只重投早于 now-3s 的 sent 行，避开「对方在读、回执没回来」的在途消息
    retry-interval-millis: 5000   # PmDeliveryRetryJob 的 @Scheduled fixedDelay：太小就是空转扫库，太大就是「对方晚看到」
    report-remark-max: 500        # 举报私信写进 audit_task.remark 的上限，与 ReportService.TASK_REMARK_MAX 同值
    block-reason-max: 200         # 拉黑理由长度：只进管理端，被拉黑人永远看不到
    block-list-max: 200           # 我的黑名单一次最多返回条数

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
